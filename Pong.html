<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic 2-Player Pong</title>
    <style>
        body { background-color: #111; color: #0f0; font-family: "Courier New", monospace; text-align: center; margin-top: 20px; }
        canvas { background-color: #000; border: 4px solid #0f0; box-shadow: 0 0 20px #0f0; }
        h1 { margin-bottom: 5px; }
        p { font-size: 1.2em; margin-top: 0; }
    </style>
</head>
<body>
    <h1>RETRO PONG: VERSUS MODE</h1>
    <p>P1: W/S | P2: UP/DOWN | Press SPACE to Serve</p>
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- STUDENTS CAN STILL HACK THESE IN F12 CONSOLE ---
        var paddleWidth = 12;
        var paddleHeight = 100;
        var paddleSpeed = 6;
        var initialBallSpeed = 4;        // Slower base speed
        var maxBallSpeed = 9;            // Hard speed limit to prevent "light speed"
        var ballSpeedMultiplier = 1.03;  // Slower acceleration per hit
        
        // Game State
        var ballX = canvas.width / 2;
        var ballY = canvas.height / 2;
        var ballSpeedX = initialBallSpeed;
        var ballSpeedY = 2;
        var ballRadius = 8;

        var p1Y = canvas.height / 2 - paddleHeight / 2;
        var p2Y = canvas.height / 2 - paddleHeight / 2;
        
        var p1Score = 0;
        var p2Score = 0;
        
        var isPlaying = false; 

        // Smooth Keyboard input tracking
        var keys = {};
        window.addEventListener('keydown', function(e) { 
            keys[e.key] = true; 
            if (e.code === 'Space' && !isPlaying) {
                isPlaying = true; 
            }
        });
        window.addEventListener('keyup', function(e) { keys[e.key] = false; });

        function resetBall(scorer) {
            ballX = canvas.width / 2;
            ballY = canvas.height / 2;
            ballSpeedX = scorer === 1 ? initialBallSpeed : -initialBallSpeed;
            // Gentler randomized Y serve speed
            ballSpeedY = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 2 + 1); 
            isPlaying = false; 
        }

        function update() {
            if ((keys['w'] || keys['W']) && p1Y > 0) p1Y -= paddleSpeed;
            if ((keys['s'] || keys['S']) && p1Y < canvas.height - paddleHeight) p1Y += paddleSpeed;
            if (keys['ArrowUp'] && p2Y > 0) p2Y -= paddleSpeed;
            if (keys['ArrowDown'] && p2Y < canvas.height - paddleHeight) p2Y += paddleSpeed;

            if (isPlaying) {
                ballX += ballSpeedX;
                ballY += ballSpeedY;

                // Wall Collisions
                if (ballY - ballRadius < 0) {
                    ballY = ballRadius;
                    ballSpeedY = -ballSpeedY;
                } else if (ballY + ballRadius > canvas.height) {
                    ballY = canvas.height - ballRadius;
                    ballSpeedY = -ballSpeedY;
                }

                // P1 Left Paddle Collision
                if (ballX - ballRadius < paddleWidth && ballY > p1Y && ballY < p1Y + paddleHeight && ballSpeedX < 0) {
                    // Apply multiplier but cap it at maxBallSpeed
                    let newSpeed = Math.abs(ballSpeedX) * ballSpeedMultiplier;
                    ballSpeedX = Math.min(newSpeed, maxBallSpeed); 
                    
                    let deltaY = ballY - (p1Y + paddleHeight / 2);
                    ballSpeedY = deltaY * 0.12; // Flatter, more realistic bounce angles
                }
                
                // P2 Right Paddle Collision
                if (ballX + ballRadius > canvas.width - paddleWidth && ballY > p2Y && ballY < p2Y + paddleHeight && ballSpeedX > 0) {
                    let newSpeed = Math.abs(ballSpeedX) * ballSpeedMultiplier;
                    ballSpeedX = -Math.min(newSpeed, maxBallSpeed); 
                    
                    let deltaY = ballY - (p2Y + paddleHeight / 2);
                    ballSpeedY = deltaY * 0.12; 
                }

                // Scoring
                if (ballX < 0) {
                    p2Score++;
                    resetBall(2);
                } else if (ballX > canvas.width) {
                    p1Score++;
                    resetBall(1);
                }
            }
        }

        function draw() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#0f0";
            for (let i = 0; i < canvas.height; i += 40) {
                ctx.fillRect(canvas.width / 2 - 2, i, 4, 20);
            }

            ctx.fillRect(0, p1Y, paddleWidth, paddleHeight); 
            ctx.fillRect(canvas.width - paddleWidth, p2Y, paddleWidth, paddleHeight); 

            ctx.beginPath();
            ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = "48px Courier New";
            ctx.textAlign = "center";
            ctx.fillText(p1Score, canvas.width / 4, 60);
            ctx.fillText(p2Score, 3 * canvas.width / 4, 60);

            if (!isPlaying) {
                ctx.font = "24px Courier New";
                ctx.fillText("PRESS SPACE TO SERVE", canvas.width / 2, canvas.height / 2 - 40);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        resetBall(1);
        gameLoop();
    </script>
</body>
</html>
