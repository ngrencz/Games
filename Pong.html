<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic 2-Player Pong</title>
    <style>
        body { background-color: #111; color: #0f0; font-family: "Courier New", monospace; text-align: center; margin-top: 20px; }
        canvas { background-color: #000; border: 4px solid #0f0; box-shadow: 0 0 20px #0f0; outline: none; }
        h1 { margin-bottom: 5px; }
        p { font-size: 1.2em; margin-top: 0; }
    </style>
</head>
<body>
    <h1>RETRO PONG: VERSUS MODE</h1>
    <p>P1: W/S | P2: UP/DOWN | Press SPACE to Serve</p>
    <canvas id="gameCanvas" width="800" height="500" tabindex="1"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Force browser to focus on the game canvas so controls work immediately
        canvas.focus();

        // --- STUDENTS CAN STILL HACK THESE IN F12 CONSOLE ---
        var paddleWidth = 12;
        var paddleHeight = 100;
        var paddleSpeed = 6;
        var initialBallSpeed = 4;
        var maxBallSpeed = 9;
        var ballSpeedMultiplier = 1.03;
        
        var ballX = canvas.width / 2;
        var ballY = canvas.height / 2;
        var ballSpeedX = initialBallSpeed;
        var ballSpeedY = 0;
        var ballRadius = 8;

        var p1Y = canvas.height / 2 - paddleHeight / 2;
        var p2Y = canvas.height / 2 - paddleHeight / 2;
        
        var p1Score = 0;
        var p2Score = 0;
        var isPlaying = false; 

        // Hardware-agnostic input tracking
        var keys = {};
        
        window.addEventListener('keydown', function(e) { 
            const gameKeys = ['KeyW', 'KeyS', 'ArrowUp', 'ArrowDown', 'Space'];
            
            // Stop the browser from searching or scrolling when pressing game keys
            if (gameKeys.includes(e.code)) {
                e.preventDefault(); 
            }
            
            keys[e.code] = true; 
            
            if (e.code === 'Space' && !isPlaying) {
                isPlaying = true; 
            }
        });
        
        window.addEventListener('keyup', function(e) { 
            keys[e.code] = false; 
        });

        function resetBall(scorer) {
            // 0 = First serve of the game (randomly picks a paddle)
            if (scorer === 0) {
                ballSpeedX = Math.random() > 0.5 ? initialBallSpeed : -initialBallSpeed;
            } 
            // P1 Scored. Serve goes to P2 (the loser of the point)
            else if (scorer === 1) {
                ballSpeedX = -initialBallSpeed; 
            } 
            // P2 Scored. Serve goes to P1 (the loser of the point)
            else if (scorer === 2) {
                ballSpeedX = initialBallSpeed; 
            }
            
            // Serve perfectly flat so it's impossible to miss the launch
            ballSpeedY = 0; 
            isPlaying = false; 
        }

        function update() {
            // Paddle Movement
            if (keys['KeyW'] && p1Y > 0) p1Y -= paddleSpeed;
            if (keys['KeyS'] && p1Y < canvas.height - paddleHeight) p1Y += paddleSpeed;
            if (keys['ArrowUp'] && p2Y > 0) p2Y -= paddleSpeed;
            if (keys['ArrowDown'] && p2Y < canvas.height - paddleHeight) p2Y += paddleSpeed;

            // If paused, PIN the ball to the serving paddle so they can aim!
            if (!isPlaying) {
                if (ballSpeedX > 0) {
                    // P1's Serve (Left side)
                    ballX = paddleWidth + ballRadius + 2;
                    ballY = p1Y + (paddleHeight / 2);
                } else {
                    // P2's Serve (Right side)
                    ballX = canvas.width - paddleWidth - ballRadius - 2;
                    ballY = p2Y + (paddleHeight / 2);
                }
            } 
            // If playing, release the ball and track physics
            else {
                ballX += ballSpeedX;
                ballY += ballSpeedY;

                // Wall Collisions
                if (ballY - ballRadius < 0) {
                    ballY = ballRadius;
                    ballSpeedY = -ballSpeedY;
                } else if (ballY + ballRadius > canvas.height) {
                    ballY = canvas.height - ballRadius;
                    ballSpeedY = -ballSpeedY;
                }

                // P1 Left Paddle Collision
                if (ballX - ballRadius < paddleWidth && ballY > p1Y && ballY < p1Y + paddleHeight && ballSpeedX < 0) {
                    let newSpeed = Math.abs(ballSpeedX) * ballSpeedMultiplier;
                    ballSpeedX = Math.min(newSpeed, maxBallSpeed); 
                    
                    // Dynamic angle based on where it hit the paddle
                    let deltaY = ballY - (p1Y + paddleHeight / 2);
                    ballSpeedY = deltaY * 0.12; 
                }
                
                // P2 Right Paddle Collision
                if (ballX + ballRadius > canvas.width - paddleWidth && ballY > p2Y && ballY < p2Y + paddleHeight && ballSpeedX > 0) {
                    let newSpeed = Math.abs(ballSpeedX) * ballSpeedMultiplier;
                    ballSpeedX = -Math.min(newSpeed, maxBallSpeed); 
                    
                    // Dynamic angle based on where it hit the paddle
                    let deltaY = ballY - (p2Y + paddleHeight / 2);
                    ballSpeedY = deltaY * 0.12; 
                }

                // Scoring
                if (ballX < 0) {
                    p2Score++;
                    resetBall(2); // P2 scored, so P1 serves next
                } else if (ballX > canvas.width) {
                    p1Score++;
                    resetBall(1); // P1 scored, so P2 serves next
                }
            }
        }

        function draw() {
            // Draw Black Background
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Dashed Net
            ctx.fillStyle = "#0f0";
            for (let i = 0; i < canvas.height; i += 40) {
                ctx.fillRect(canvas.width / 2 - 2, i, 4, 20);
            }

            // Draw Paddles
            ctx.fillRect(0, p1Y, paddleWidth, paddleHeight); 
            ctx.fillRect(canvas.width - paddleWidth, p2Y, paddleWidth, paddleHeight); 

            // Draw Ball
            ctx.beginPath();
            ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
            ctx.fill();

            // Draw Scores
            ctx.font = "48px Courier New";
            ctx.textAlign = "center";
            ctx.fillText(p1Score, canvas.width / 4, 60);
            ctx.fillText(p2Score, 3 * canvas.width / 4, 60);

            // Draw Prompt
            if (!isPlaying) {
                ctx.font = "24px Courier New";
                ctx.fillText("PRESS SPACE TO SERVE", canvas.width / 2, canvas.height / 2 - 40);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Initialize first serve
        resetBall(0);
        gameLoop();
    </script>
</body>
</html>
